name: Capri AI Android APK

on:
  push:
    branches: [ "main" ]
    tags: [ "capri-v*" ]
    paths:
      - 'CapriAI/**'
      - '.github/workflows/capri-ai-android.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capri-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Capri AI APK
        working-directory: CapriAI
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Capri-AI-Android-debug
          path: CapriAI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish Capri release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/capri-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="CapriAI/app/build/outputs/apk/debug/app-debug.apk"
          TAG="capri-v0.9.5"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Capri AI Android 0.9.5" --notes "Capri 0.9.5: personalidade feminina mais fiel e consistente em português brasileiro, animações espontâneas de descanso, jogo, assobio e música, personagem que senta sobre o balão de diálogo, movimento livre e teleporte. Mantém voz PT-BR e diálogos offline procedurais."
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "Capri AI Android 0.9.5" --notes "Capri 0.9.5: personalidade feminina mais fiel e consistente em português brasileiro, animações espontâneas de descanso, jogo, assobio e música, personagem que senta sobre o balão de diálogo, movimento livre e teleporte. Mantém voz PT-BR e diálogos offline procedurais. APK debug ARMv7/ARM64."
          fi
