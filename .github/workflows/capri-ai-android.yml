name: Capri AI Android APK

on:
  push:
    branches: [ "main" ]
    tags: [ "capri-v*" ]
    paths:
      - 'CapriAI/**'
      - '.github/workflows/capri-ai-android.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capri-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download Sherpa-ONNX Android runtime
        run: |
          mkdir -p CapriAI/app/libs
          curl --fail --location --retry 3 --output CapriAI/app/libs/sherpa-onnx-2.0.1.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar
          test -s CapriAI/app/libs/sherpa-onnx-2.0.1.aar
      - name: Build Capri AI APK
        working-directory: CapriAI
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Capri-AI-Android-debug
          path: CapriAI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish Capri release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/capri-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="CapriAI/app/build/outputs/apk/debug/app-debug.apk"
          TAG="capri-v1.0.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Capri AI Android 1.0.0" --notes "Capri 1.0.0: interface terminal com chuva binária animada; voz neural offline PT-BR via Sherpa-ONNX/Piper (modelo opcional baixado no aparelho); roupas, chapéus, bunny girl, expressões e novas coreografias; módulos de web, aplicativos e leitura de tela com acessibilidade opt-in; ícone adaptativo do olho Capri; diagnóstico de conexão OpenAI. Voz local exige baixar pacote de modelo de aproximadamente 63 MB. Login Google requer client ID OAuth configurado pelo desenvolvedor. APK debug ARMv7/ARM64/x86/x86_64."
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "Capri AI Android 1.0.0" --notes "Capri 1.0.0: interface terminal com chuva binária animada; voz neural offline PT-BR via Sherpa-ONNX/Piper (modelo opcional baixado no aparelho); roupas, chapéus, bunny girl, expressões e novas coreografias; módulos de web, aplicativos e leitura de tela com acessibilidade opt-in; ícone adaptativo do olho Capri; diagnóstico de conexão OpenAI. Voz local exige baixar pacote de modelo de aproximadamente 63 MB. Login Google requer client ID OAuth configurado pelo desenvolvedor. APK debug ARMv7/ARM64/x86/x86_64."
          fi
