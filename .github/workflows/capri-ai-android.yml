name: Capri AI Android APK
on:
  push:
    paths:
      - 'CapriAI/**'
      - '.github/workflows/capri-ai-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK for ARMv7 and ARM64
        working-directory: CapriAI
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Capri-AI-Android-debug
          path: CapriAI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
