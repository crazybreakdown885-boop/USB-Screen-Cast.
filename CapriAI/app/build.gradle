plugins { id 'com.android.application' }
android {
 namespace 'com.nightcity.capriai'
 compileSdk 35
 defaultConfig { applicationId 'com.nightcity.capriai'; minSdk 29; targetSdk 34; versionCode 22; versionName '1.0.0'; ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation fileTree(dir: 'libs', include: ['*.aar'])
 implementation 'org.apache.commons:commons-compress:1.27.1'
 implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.20'
}
// Capri 1.0.0: matrix terminal, offline PT-BR voice, accessibility, outfits and choreography.
